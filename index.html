<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>RedBull</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg"><video id="bgvid" muted playsinline autoplay preload="auto" aria-hidden="true"></video><i class="shade"></i></div>
<div id="idbanner" class="glass idbanner" hidden></div>
<main id="main"></main>
<section id="detail" class="sheet" aria-hidden="true"></section>
<section id="admin" class="sheet" aria-hidden="true"></section>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast"></div>

<nav class="tabbar glass" id="tabbar" style="--i:0">
  <span class="pill" id="pill"></span>
  <button data-act="tab" data-tab="home" class="on">
    <svg viewBox="0 0 24 24"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg><span>RedBull</span>
  </button>
  <button data-act="tab" data-tab="cart">
    <svg viewBox="0 0 24 24"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.4a2 2 0 0 0 1.9-1.4L21 8H6.2"/><circle cx="10" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg><span>Корзина</span><i class="badge" id="badge" hidden>0</i>
  </button>
  <button data-act="tab" data-tab="info">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg><span>Info</span>
  </button>
</nav>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
